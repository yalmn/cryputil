<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>cryputil</title>
<link rel="stylesheet" href="./styles.css" />
</head>
<body>
<div class="crt">
  <div id="pane-toolbar" class="pane-toolbar">
    <button type="button" id="btn-split-v" title="Vertikal teilen (neue Pane rechts)">⬌ Split</button>
    <button type="button" id="btn-split-h" title="Horizontal teilen (neue Pane unten)">⬍ Split</button>
    <button type="button" id="btn-cycle" title="Nächste Pane">↻ Nächste</button>
    <button type="button" id="btn-zoom" title="Pane maximieren / zurück">⛶ Zoom</button>
    <button type="button" id="btn-close" title="Aktive Pane schließen">✕ Pane</button>
  </div>
  <div id="pane-root" class="pane-root"></div>
</div>

<template id="pane-template">
  <div class="pane-leaf">
    <div class="breadcrumb">
      <span class="breadcrumb-path">cryputil</span>
      <span class="breadcrumb-hint">
        <kbd>/</kbd> Suche &nbsp; <kbd>Esc</kbd> Zurück &nbsp; <kbd>Ctrl+L</kbd> Clear &nbsp; <kbd>Ctrl+Shift+B</kbd> Split
      </span>
    </div>
    <div class="terminal" aria-live="polite"></div>
    <form class="prompt-form prompt-line" autocomplete="off">
      <span class="prompt">cryputil&gt;&nbsp;</span>
      <input class="prompt-input" type="text" spellcheck="false"
             autocapitalize="off" autocorrect="off" />
      <span class="cursor" aria-hidden="true"></span>
    </form>
  </div>
</template>

<div id="prefix-hint" class="prefix-hint">PREFIX (Ctrl+B)…</div>

<div id="palette" class="palette hidden" aria-hidden="true">
  <div class="palette-box" role="dialog" aria-label="Befehls-Suche">
    <div id="palette-cwd" class="palette-cwd">cryputil</div>
    <input id="palette-input" type="text" placeholder="Befehl suchen oder mit ↑↓ stöbern…"
           spellcheck="false" autocapitalize="off" autocorrect="off" />
    <div class="palette-grid">
      <ul id="palette-list" class="palette-list"></ul>
      <aside id="palette-info" class="palette-info">
        <div class="palette-info-empty">Eintrag wählen, um eine Erklärung zu sehen…</div>
      </aside>
    </div>
    <div class="palette-foot">
      <kbd>↑</kbd><kbd>↓</kbd> wählen &nbsp; <kbd>Enter</kbd> öffnen / starten &nbsp; <kbd>⌫</kbd> Ebene zurück &nbsp; <kbd>Esc</kbd> schließen
    </div>
  </div>
</div>

<script type="module" src="./app.js"></script>
</body>
</html>
