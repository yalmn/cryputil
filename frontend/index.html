<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>cryputil</title>
<link rel="stylesheet" href="./styles.css" />
</head>
<body>
<div class="crt">
  <div id="terminal" class="terminal" aria-live="polite"></div>
  <form id="prompt-form" class="prompt-line" autocomplete="off">
    <span class="prompt">cryputil&gt;&nbsp;</span>
    <input id="prompt-input" type="text" autofocus spellcheck="false"
           autocapitalize="off" autocorrect="off" />
    <span class="cursor" aria-hidden="true"></span>
  </form>
</div>
<script type="module" src="./app.js"></script>
</body>
</html>
