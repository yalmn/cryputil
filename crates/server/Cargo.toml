[package]
name = "cryputil-server"
version = "0.2.0"
edition = "2021"

[[bin]]
name = "cryputil-server"
path = "src/main.rs"

[dependencies]
cryputil-core = { path = "../core", features = ["serde"] }
axum = "0.7"
tokio = { version = "1", features = ["macros", "rt-multi-thread", "signal"] }
tower = "0.5"
tower-http = { version = "0.6", features = ["cors", "limit", "timeout", "trace"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

[dev-dependencies]
http-body-util = "0.1"
